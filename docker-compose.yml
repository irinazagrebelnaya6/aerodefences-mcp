# Відтворюване середовище: MySQL (із seed db/init.sql) + MCP-сервер.
# Запуск:  docker compose up --build
#   MySQL    -> 127.0.0.1:3307  (щоб не конфліктувати з локальним 3306)
#   MCP HTTP -> 127.0.0.1:8000
#   Metrics  -> 127.0.0.1:9100/metrics
#
# Секрети НЕ зашиті у файл — беруться з .env (не в git). Обовʼязкові змінні
# позначені `:?` і зупинять запуск, якщо їх не задано. Див. .env.example.
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${ADD_DB_NAME:-aerodefences}
      MYSQL_USER: ${ADD_DB_USER:?set ADD_DB_USER in .env}
      MYSQL_PASSWORD: ${ADD_DB_PASSWORD:?set ADD_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      # seed виконується автоматично при першій ініціалізації тому.
      # ⚠️ Прод: init.sql — лише dev-seed; схему котити міграціями (PRODUCTION.md 4.4).
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  mcp:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADD_DB_HOST: db
      ADD_DB_PORT: "3306"
      ADD_DB_USER: ${ADD_DB_USER:?set ADD_DB_USER in .env}
      ADD_DB_PASSWORD: ${ADD_DB_PASSWORD:?set ADD_DB_PASSWORD in .env}
      ADD_DB_NAME: ${ADD_DB_NAME:-aerodefences}
      ADD_DB_POOL_SIZE: "5"
      ADD_TRANSPORT: http
      ADD_HTTP_HOST: 0.0.0.0
      ADD_HTTP_PORT: "8000"
      ADD_METRICS_PORT: "9100"
      ADD_ROLE: viewer          # deny-by-default; підвищення лише через JWT-claims
      ADD_LOG_LEVEL: INFO
      ADD_LOG_FORMAT: json
      # JWT-authn обовʼязковий для HTTP — без ключів сервіс не стартує (fail-safe).
      ADD_JWT_JWKS_URI: ${ADD_JWT_JWKS_URI:?set ADD_JWT_JWKS_URI in .env}
      ADD_JWT_ISSUER: ${ADD_JWT_ISSUER:-}
      ADD_JWT_AUDIENCE: ${ADD_JWT_AUDIENCE:-}
      # Спільний сесійний стан + semantic cache. Порожньо → in-process фолбек.
      # Для профілю voyage передають ADD_REDIS_URL=redis://redis:6379/0.
      ADD_REDIS_URL: ${ADD_REDIS_URL:-}
      ADD_SEMCACHE: ${ADD_SEMCACHE:-off}
      ADD_SEMCACHE_TTL: ${ADD_SEMCACHE_TTL:-3600}
      ADD_SEMCACHE_THRESHOLD: ${ADD_SEMCACHE_THRESHOLD:-0.93}
      # RAG: бекенд пошуку. tfidf (дефолт) — офлайн; voyage — семантичні
      # embeddings. У voyage-режимі mcp НЕ тримає ключ Voyage: він ходить у
      # sidecar `embeddings` по HTTP (ADD_EMBEDDINGS_URL). Sidecar-патерн:
      # логіка токенізації/кешування винесена в окремий контейнер.
      ADD_RAG_BACKEND: ${ADD_RAG_BACKEND:-tfidf}
      ADD_EMBEDDINGS_URL: ${ADD_EMBEDDINGS_URL:-}
      ADD_EMBED_MODEL: ${ADD_EMBED_MODEL:-voyage-4-lite}
      ADD_EMBED_DIM: ${ADD_EMBED_DIM:-1024}
      # Vector DB (для ADD_RAG_BACKEND=qdrant): у профілі voyage → http://qdrant:6333
      ADD_QDRANT_URL: ${ADD_QDRANT_URL:-}
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:9100:9100"
    healthcheck:
      # Liveness через prometheus-ендпоінт (curl в slim-образі немає → python).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9100/metrics')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # ── Sidecar: embeddings/tokenization proxy ──────────────────────────────
  # Окремий контейнер поруч із mcp; тримає клієнт Voyage + кеш. mcp ходить сюди
  # по HTTP (http://embeddings:8100). Стартує лише під профілем `voyage`, щоб
  # дефолтний `docker compose up` (tfidf) не вимагав ключа:
  #   ADD_RAG_BACKEND=voyage ADD_EMBEDDINGS_URL=http://embeddings:8100 \
  #     ADD_REDIS_URL=redis://redis:6379/0 ADD_SEMCACHE=on \
  #     VOYAGE_API_KEY=... docker compose --profile voyage up --build
  embeddings:
    build:
      context: .
      dockerfile: sidecar/Dockerfile
    profiles: ["voyage"]
    environment:
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}   # sidecar тримає ключ; mcp — ні
      ADD_EMBED_MODEL: ${ADD_EMBED_MODEL:-voyage-4-lite}
      ADD_EMBED_DIM: ${ADD_EMBED_DIM:-1024}
    ports:
      - "127.0.0.1:8100:8100"
    volumes:
      - embeddings_cache:/cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # ── Redis: спільне in-memory сховище (semantic cache + стан сесій) ───────
  # Окремий сервіс поза процесом mcp. Піднімається профілем `voyage` разом із
  # sidecar (semantic cache має сенс лише з embeddings). Персистентність не
  # потрібна: кеш має TTL + інвалідацію на write, стан сесії — ефемерний.
  redis:
    image: redis:7-alpine
    profiles: ["voyage"]
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 192M

  # ── Qdrant: справжня vector-DB для RAG (ANN-пошук поза процесом mcp) ─────
  # Альтернатива in-memory косинусу: вектори живуть у спеціалізованому сховищі.
  # Профіль voyage; вмикається через ADD_RAG_BACKEND=qdrant + ADD_QDRANT_URL:
  #   ADD_RAG_BACKEND=qdrant ADD_QDRANT_URL=http://qdrant:6333 \
  #     ADD_EMBEDDINGS_URL=http://embeddings:8100 VOYAGE_API_KEY=... \
  #     docker compose --profile voyage up --build
  qdrant:
    image: qdrant/qdrant:latest
    profiles: ["voyage"]
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

volumes:
  embeddings_cache:
  qdrant_storage:
